services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl
      POSTGRES_DB: etl
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl"]
      interval: 3s
      retries: 20

  # one-shot job:  docker compose run --rm etl --data-dir data/v1
  etl:
    build: .
    profiles: ["tools"]
    entrypoint: ["python", "-m", "etl", "run", "--config", "config/sources.yaml"]
    environment:
      DATABASE_URL: postgresql://etl:etl@db:5432/etl
    depends_on:
      db: {condition: service_healthy}

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://etl:etl@db:5432/etl
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
